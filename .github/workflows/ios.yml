name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
    tags:
      - "ios-v*"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS|Simulator" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Navideck.xcodeproj \
            -scheme Navideck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Navideck.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/Navideck.xcarchive/Products/Applications/Navideck.app build/Payload/
          cd build
          zip -qry Navideck-unsigned.ipa Payload
          ls -lh Navideck-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Navideck-unsigned-ipa
          path: ios/build/Navideck-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/Navideck-unsigned.ipa
          name: Navideck iOS ${{ github.ref_name }}
          body: |
            Native iOS-App für Navidrome und andere Subsonic-Server.

            **Installation:** Die IPA ist unsigniert. Mit
            [Sideloadly](https://sideloadly.io) oder [AltStore](https://altstore.io)
            und der eigenen Apple-ID signieren und aufs iPhone spielen.

            Ein kostenloser Apple-Account signiert für 7 Tage; danach neu signieren. Mit
            bezahltem Developer-Programm entfällt das.
          generate_release_notes: false
