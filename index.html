<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Navideck</title>
    <meta
      name="description"
      content="Musik, Hörbücher und Podcasts von Navidrome und Audiobookshelf – für Desktop, Tablet und Steam Deck."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#140e1f" />
    <!--
      iOS/macOS: "black-translucent" lets the app paint behind the status bar,
      the safe-area insets in index.css keep the content clear of it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Navideck" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Track and album titles like "Folge 1" must not turn into phone links. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <style>
      /* Painted before the bundle loads: no white flash on a cold start. */
      html {
        background: #140e1f;
      }
      html[data-theme='light'] {
        background: #f3eefb;
      }
      /* Shown only if the bundle never starts; a white page tells nobody why. */
      #boot-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem;
        font: 15px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        color: #f2ecfd;
        background: #140e1f;
      }
      #boot-error[hidden] {
        display: none;
      }
      #boot-error p {
        margin: 0;
        max-width: 34rem;
      }
      #boot-error a {
        color: #c3a5ff;
      }
      #boot-detail {
        max-width: min(90vw, 44rem);
        max-height: 40vh;
        overflow: auto;
        margin: 0.35rem 0 0;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.07);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: left;
      }
      #boot-detail[hidden] {
        display: none;
      }
      @media (prefers-color-scheme: light) {
        #boot-error {
          color: #2e2540;
          background: #f3eefb;
        }
        #boot-error a {
          color: #7a4fd6;
        }
        #boot-detail {
          background: rgba(46, 37, 64, 0.08);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement

          root.setAttribute(
            'data-theme',
            localStorage.getItem('navideck.theme') === 'light' ? 'light' : 'dark',
          )

          var saved = localStorage.getItem('navideck.uiMode')
          if (saved === 'deck' || saved === 'desktop') {
            root.setAttribute('data-ui', saved)
            return
          }
          var ua = navigator.userAgent
          var handheld = /SteamDeck|SteamOS|Steam Client|\bValve\b|ROG Ally|Legion Go/i.test(ua)
          if (!handheld) {
            var w = innerWidth
            var h = innerHeight
            var shortSide = Math.min(w, h)
            var longSide = Math.max(w, h)
            var touch = navigator.maxTouchPoints > 0
            var coarse = matchMedia('(pointer: coarse)').matches
            if (touch && shortSide >= 700 && shortSide <= 900 && longSide >= 1100 && longSide <= 1400) handheld = true
            else if (
              (touch || coarse) &&
              shortSide >= 900 &&
              shortSide <= 1200 &&
              longSide >= 1600 &&
              longSide <= 2560 &&
              ((devicePixelRatio || 1) >= 1.2 || coarse)
            ) {
              handheld = true
            }
          }
          root.setAttribute('data-ui', handheld ? 'deck' : 'desktop')
        } catch (e) {}
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
          document.documentElement.classList.add('standalone')
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" hidden>
      <p><strong>Navideck konnte nicht starten.</strong></p>
      <p>
        Lade die Seite neu. Hilft das nicht, leere den Cache für diese Adresse (in den
        Einstellungen des Browsers).
      </p>
      <pre id="boot-detail" hidden></pre>
      <p><a href="/">Neu laden</a></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Runs whether or not the module above ever arrives: `load` also fires when
       * the bundle 404s, so nothing here can hang on a broken build. The first
       * error is kept and printed, because a page that died for a reason must
       * name the reason instead of asking the user to guess.
       */
      (function () {
        var detail = ''
        var box = function () {
          return document.getElementById('boot-error')
        }
        var rootEmpty = function () {
          var root = document.getElementById('root')
          return !root || root.childElementCount === 0
        }
        function paint() {
          var el = box()
          if (!el) return
          el.hidden = !rootEmpty()
          var slot = document.getElementById('boot-detail')
          if (slot && !slot.hidden) return
          if (slot && detail) {
            slot.textContent = detail
            slot.hidden = false
          }
        }
        function note(text) {
          if (detail || !text) return
          detail = text
          paint()
        }
        window.addEventListener(
          'error',
          function (e) {
            var target = e && e.target
            if (target && target !== window && (target.src || target.href)) {
              // Only our own files: a blocked font must not read like a crash.
              var url = target.src || target.href
              if (url.indexOf(location.origin) === 0) note('Datei nicht geladen:\n' + url)
              return
            }
            if (e && e.error && e.error.message) note(e.error.message)
            else if (e && e.message) note(e.message)
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason
          if (reason && (reason.message || reason.stack)) note(String(reason.message || reason))
          else if (reason) note(String(reason))
        })
        function reveal() {
          window.setTimeout(function () {
            if (rootEmpty()) paint()
          }, 1500)
        }
        if (document.readyState === 'complete') reveal()
        else window.addEventListener('load', reveal)

        // A late mount means the page is fine after all; take the notice away.
        var root = document.getElementById('root')
        if (root && window.MutationObserver) {
          new MutationObserver(function () {
            if (!rootEmpty()) {
              var el = box()
              if (el) el.hidden = true
            }
          }).observe(root, { childList: true })
        }
      })()
    </script>
  </body>
</html>
