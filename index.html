<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Navideck</title>
    <meta
      name="description"
      content="Musik, Hörbücher und Podcasts von Navidrome und Audiobookshelf – für Desktop, Tablet und Steam Deck."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#140e1f" />
    <!--
      iOS/macOS: "black-translucent" lets the app paint behind the status bar,
      the safe-area insets in index.css keep the content clear of it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Navideck" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Track and album titles like "Folge 1" must not turn into phone links. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <style>
      /* Painted before the bundle loads: no white flash on a cold start. */
      html {
        background: #140e1f;
      }
      html[data-theme='light'] {
        background: #f3eefb;
      }
      /* Shown only if the bundle never starts; a white page tells nobody why. */
      #boot-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem;
        font: 15px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        color: #f2ecfd;
        background: #140e1f;
      }
      #boot-error[hidden] {
        display: none;
      }
      #boot-error p {
        margin: 0;
        max-width: 34rem;
      }
      #boot-error a {
        color: #c3a5ff;
      }
      @media (prefers-color-scheme: light) {
        #boot-error {
          color: #2e2540;
          background: #f3eefb;
        }
        #boot-error a {
          color: #7a4fd6;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement

          root.setAttribute(
            'data-theme',
            localStorage.getItem('navideck.theme') === 'light' ? 'light' : 'dark',
          )

          var saved = localStorage.getItem('navideck.uiMode')
          if (saved === 'deck' || saved === 'desktop') {
            root.setAttribute('data-ui', saved)
            return
          }
          var ua = navigator.userAgent
          var handheld = /SteamDeck|SteamOS|Steam Client|\bValve\b|ROG Ally|Legion Go/i.test(ua)
          if (!handheld) {
            var w = innerWidth
            var h = innerHeight
            var shortSide = Math.min(w, h)
            var longSide = Math.max(w, h)
            var touch = navigator.maxTouchPoints > 0
            var coarse = matchMedia('(pointer: coarse)').matches
            if (touch && shortSide >= 700 && shortSide <= 900 && longSide >= 1100 && longSide <= 1400) handheld = true
            else if (
              (touch || coarse) &&
              shortSide >= 900 &&
              shortSide <= 1200 &&
              longSide >= 1600 &&
              longSide <= 2560 &&
              ((devicePixelRatio || 1) >= 1.2 || coarse)
            ) {
              handheld = true
            }
          }
          root.setAttribute('data-ui', handheld ? 'deck' : 'desktop')
        } catch (e) {}
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
          document.documentElement.classList.add('standalone')
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" hidden>
      <p><strong>Navideck konnte nicht starten.</strong></p>
      <p>
        Meist liegt noch eine alte Datei im Cache. Lade die Seite neu – hilft das nicht, leere den
        Cache für diese Adresse (in den Einstellungen des Browsers).
      </p>
      <p><a href="/">Neu laden</a></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Runs whether or not the module above ever arrives: `load` also fires when
       * the bundle 404s, so nothing here can hang on a broken build.
       */
      (function () {
        function reveal() {
          window.setTimeout(function () {
            var root = document.getElementById('root')
            var box = document.getElementById('boot-error')
            if (root && box && !root.childElementCount) box.hidden = false
          }, 1500)
        }
        if (document.readyState === 'complete') reveal()
        else window.addEventListener('load', reveal)
      })()
    </script>
  </body>
</html>
