server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Content-hashed bundles never change under the same name, so they can be
  # cached forever. A missing one must 404 instead of falling back to
  # index.html: otherwise the browser parses HTML as JavaScript and the app
  # appears to hang after a redeploy.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location /icons/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # The service worker itself must never be cached, or updates stall.
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
